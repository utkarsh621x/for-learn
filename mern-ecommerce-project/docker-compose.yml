services:
  mongo:
    image: mongo:7
    container_name: ptap-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ptap-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ptap-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - ptap-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ptap-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - ptap-net

volumes:
  mongo_data:

networks:
  ptap-net:
    driver: bridge