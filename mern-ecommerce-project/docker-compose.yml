services:
  mongo:
    image: mongo:7
    container_name: ptap-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ptap-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ptap-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "5000:5000"
    environment:
      MONGO_URI: mongodb://mongo:27017/ptap_delivery
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ptap-net

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ptap-worker
    restart: unless-stopped
    command: ["node", "src/worker.js"]
    env_file:
      - ./backend/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/ptap_delivery
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ptap-net

  redis:
    image: redis:7-alpine
    container_name: ptap-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ptap-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ptap-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - ptap-net

volumes:
  mongo_data:
  redis_data:

networks:
  ptap-net:
    driver: bridge