apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: ptap
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: docker.io/library/mern-ecommerce-project-backend:latest
          imagePullPolicy: Never
          command: ["node", "src/worker.js"]
          envFrom:
            - configMapRef:
                name: backend-config
